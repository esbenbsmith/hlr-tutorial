<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5c16" />
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff" />

  <text x="450" y="30" text-anchor="middle" font-size="16" fill="#707070">HLR — fra indbringelse til offentliggørelse</text>

  <!-- connectors (drawn first, so boxes sit on top of the line ends) -->
  <line x1="450" y1="92" x2="450" y2="138" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="450" y1="212" x2="450" y2="258" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="450" y1="332" x2="160" y2="398" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="450" y1="332" x2="450" y2="398" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="450" y1="332" x2="740" y2="398" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="740" y1="472" x2="740" y2="518" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Indbringelsesmodul -->
  <rect x="300" y="52" width="300" height="70" rx="10" fill="#44831e" />
  <text x="450" y="93" text-anchor="middle" font-size="20" fill="#ffffff">Indbringelsesmodul</text>

  <!-- Sagsbehandlingsmodul -->
  <rect x="300" y="172" width="300" height="70" rx="10" fill="#44831e" />
  <text x="450" y="213" text-anchor="middle" font-size="20" fill="#ffffff">Sagsbehandlingsmodul</text>

  <!-- Publiceringsmodul -->
  <rect x="300" y="292" width="300" height="70" rx="10" fill="#44831e" />
  <text x="450" y="333" text-anchor="middle" font-size="20" fill="#ffffff">Publiceringsmodul</text>

  <!-- Afgørelsesregister -->
  <rect x="30" y="400" width="260" height="70" rx="10" fill="#2f5c16" />
  <text x="160" y="441" text-anchor="middle" font-size="18" fill="#ffffff">Afgørelsesregister</text>

  <!-- Huslejeregister -->
  <rect x="320" y="400" width="260" height="70" rx="10" fill="#2f5c16" />
  <text x="450" y="441" text-anchor="middle" font-size="18" fill="#ffffff">Huslejeregister</text>

  <!-- Statusregister -->
  <rect x="610" y="400" width="260" height="70" rx="10" fill="#2f5c16" />
  <text x="740" y="441" text-anchor="middle" font-size="18" fill="#ffffff">Statusregister</text>

  <!-- Ejendomsdatarapporten (external destination — outline style, not a solid HLR-internal box) -->
  <rect x="610" y="520" width="260" height="70" rx="10" fill="#ffffff" stroke="#44831e" stroke-width="2.5" stroke-dasharray="6 4" />
  <text x="740" y="561" text-anchor="middle" font-size="17" fill="#2f5c16">Ejendomsdatarapporten</text>
</svg>
