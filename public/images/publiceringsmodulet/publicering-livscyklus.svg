<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5c16" />
    </marker>
  </defs>

  <rect width="900" height="620" fill="#ffffff" />

  <text x="450" y="25" text-anchor="middle" font-size="16" fill="#707070">En sags vej gennem Publiceringsmodulet</text>

  <!-- connectors -->
  <line x1="450" y1="90" x2="450" y2="156" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow3)" />
  <text x="465" y="134" font-size="13" font-weight="600" fill="#2f5c16">Indberettes seneste 14 dage efter</text>

  <line x1="450" y1="210" x2="450" y2="266" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow3)" />

  <line x1="450" y1="330" x2="450" y2="386" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow3)" />
  <text x="465" y="364" font-size="13" font-weight="600" fill="#2f5c16">Indberettes seneste 14 dage efter</text>

  <line x1="450" y1="470" x2="160" y2="518" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow3)" />
  <line x1="450" y1="470" x2="450" y2="518" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow3)" />
  <line x1="450" y1="470" x2="740" y2="518" stroke="#2f5c16" stroke-width="2.5" marker-end="url(#arrow3)" />

  <!-- Sag indbringes -->
  <rect x="280" y="50" width="340" height="70" rx="10" fill="#44831e" />
  <text x="450" y="91" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Sag indbringes</text>

  <!-- Publicering oprettes -->
  <rect x="280" y="170" width="340" height="70" rx="10" fill="#44831e" />
  <text x="450" y="211" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Publicering oprettes</text>

  <!-- Sagsbehandling og afslutning -->
  <rect x="280" y="280" width="340" height="70" rx="10" fill="#44831e" />
  <text x="450" y="321" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Sagsbehandling og afslutning</text>

  <!-- Publicering opdateres -->
  <rect x="280" y="390" width="340" height="80" rx="10" fill="#44831e" />
  <text x="450" y="424" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Publicering opdateres</text>
  <text x="450" y="447" text-anchor="middle" font-size="13" fill="#ffffff">pseudonymiseret afgørelsestekst</text>

  <!-- Afgørelsesregistret -->
  <rect x="30" y="520" width="260" height="80" rx="10" fill="#2f5c16" />
  <text x="160" y="558" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Afgørelsesregistret</text>
  <text x="160" y="580" text-anchor="middle" font-size="12" fill="#ffffff">Afsluttede sager</text>

  <!-- Huslejeregistret -->
  <rect x="320" y="520" width="260" height="80" rx="10" fill="#2f5c16" />
  <text x="450" y="558" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Huslejeregistret</text>
  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#ffffff">Afsluttede sager</text>

  <!-- Statusregistret -->
  <rect x="610" y="520" width="260" height="80" rx="10" fill="#2f5c16" />
  <text x="740" y="558" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Statusregistret</text>
  <text x="740" y="580" text-anchor="middle" font-size="12" fill="#ffffff">Afsluttede + verserende</text>
</svg>
