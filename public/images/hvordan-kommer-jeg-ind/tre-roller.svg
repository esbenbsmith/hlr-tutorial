<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="260" fill="#ffffff" />

  <text x="450" y="25" text-anchor="middle" font-size="16" fill="#707070">De tre roller i Huslejenaevn.dk</text>

  <!-- Sekretariatsleder -->
  <rect x="30" y="50" width="260" height="180" rx="10" fill="#44831e" />
  <text x="160" y="106" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Sekretariatsleder</text>
  <text x="160" y="152" text-anchor="middle" font-size="13" fill="#ffffff">Behandler sager</text>
  <text x="160" y="170" text-anchor="middle" font-size="13" fill="#ffffff">Fordeler sager og laver</text>
  <text x="160" y="188" text-anchor="middle" font-size="13" fill="#ffffff">opsætning for kommunen</text>

  <!-- Sagsbehandler -->
  <rect x="320" y="50" width="260" height="180" rx="10" fill="#44831e" />
  <text x="450" y="106" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Sagsbehandler</text>
  <text x="450" y="152" text-anchor="middle" font-size="13" fill="#ffffff">Behandler sager</text>

  <!-- Administrativ medarbejder -->
  <rect x="610" y="50" width="260" height="180" rx="10" fill="#44831e" />
  <text x="740" y="90" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">Administrativ</text>
  <text x="740" y="114" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">medarbejder</text>
  <text x="740" y="152" text-anchor="middle" font-size="13" fill="#ffffff">Publicerer afgørelser</text>
</svg>
